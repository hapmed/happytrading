services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Usa TU Postgres existente (host "postgres" en la red apps-net)
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio (mín. 32 caracteres)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY es obligatorio (mín. 32 caracteres)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-hapmed}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@happytrading.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD es obligatorio}
      REGISTRATION_TOKEN: ${REGISTRATION_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      BITSO_API_BASE: ${BITSO_API_BASE:-https://bitso.com}
      PORT: 4000
      BOT_INTERVAL_MS: ${BOT_INTERVAL_MS:-60000}
      EXEC_INTERVAL_MS: ${EXEC_INTERVAL_MS:-20000}
    ports:
      - "127.0.0.1:${WEB_PORT:-8082}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - apps-net

networks:
  apps-net:
    external: true
